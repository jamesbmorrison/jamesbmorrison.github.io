<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James Morrison</title>
<meta name="description" content="James Morrison: network security and applied AI. Site coming soon.">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0969da; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  main { max-width:520px; text-align:center; }
  h1 { font-size:2.4rem; margin:0 0 6px; letter-spacing:-0.02em; }
  .tag { color:var(--muted); margin:0 0 28px; }
  .soon { display:inline-block; font-size:.8rem; color:var(--muted);
          border:1px solid var(--line); border-radius:999px; padding:3px 12px; margin-bottom:28px; }
  ul { list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap;
       justify-content:center; gap:8px 22px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>James Morrison</h1>
  <p class="tag">Network security &middot; Applied AI</p>
  <span class="soon">Site coming soon</span>
  <ul>
    <li><a href="https://github.com/jamesbmorrison">GitHub</a></li>
    <li><a href="https://www.linkedin.com/in/james-b-morrison/">LinkedIn</a></li>
    <li><a href="mailto:james@jamesbmorrison.com">james@jamesbmorrison.com</a></li>
  </ul>
</main>
</body>
</html>
